name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python + Fortran (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create conda environment from environment.yml
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Show toolchain versions
        shell: bash
        run: |
          python --version
          gfortran --version
          fpm --version

      - name: Install metalkit in editable mode
        shell: bash
        run: python -m pip install --no-deps -e .

      - name: Python tests
        shell: bash
        run: python -m pytest

      - name: Fortran tests
        shell: bash
        run: fpm test
