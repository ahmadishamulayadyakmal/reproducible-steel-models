name: metallurgy-portfolio
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Fortran toolchain: fpm 0.12 with a Fortran 2018 compiler.
  - gfortran>=11
  - fpm=0.12
  # Scientific Python stack declared by pyproject.toml.
  # Exact versions used for the C01 baseline; keep in sync with pyproject.toml.
  - numpy=2.1.3
  - pandas=2.2.3
  - scipy=1.14.1
  - scikit-learn=1.5.2
  - joblib=1.4.2
  - threadpoolctl=3.5.0
  - pint>=0.23
  - pyyaml>=6.0
  - pandera>=0.18
  - pytest=8.3.4
  - pytest-cov>=4.1
  - pre-commit>=3.5
