[project]
name = "metallurgy-portfolio"
version = "0.1.0"
description = "Reproducible environment for the 52-sprint computational metallurgy portfolio"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tasks]
test-py = "python -m pytest"
test-fortran = "fpm test"
test = "python -m pytest && fpm test"
all = "pixi run test"

[dependencies]
python = "3.11.*"
pip = "*"
gfortran = ">=11"
fpm = "0.12.*"
numpy = "2.1.3"
pandas = "2.2.3"
scipy = "1.14.1"
scikit-learn = "1.5.2"
joblib = "1.4.2"
threadpoolctl = "3.5.0"
pint = ">=0.23"
pyyaml = ">=6.0"
pandera = ">=0.18"
pytest = "8.3.4"
pytest-cov = ">=4.1"
pre-commit = ">=3.5"
