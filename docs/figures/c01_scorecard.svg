<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" role="img" aria-label="C01 predictive case scorecard">
<rect width="980" height="660" fill="#ffffff"/>
<text x="40" y="50" fill="#17202c" font-size="25" font-weight="bold" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">C01 — predictive case scorecard</text>
<text x="40" y="78" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">RandomForest · public data · 5 seeds / 5 official folds · no plant data</text>
<line x1="40" y1="96" x2="940" y2="96" stroke="#d8dee9" stroke-width="1"/>
