<text x="60" y="146" fill="#0f766e" font-size="15" font-weight="bold" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">PREDICTIVE MODEL — ours (mean ± std)</text>
<rect x="60" y="166" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="190" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">D01 exact-match accuracy</text><text x="448" y="190" fill="#0f766e" font-size="14" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">0.6766 ± 0.0075</text>
