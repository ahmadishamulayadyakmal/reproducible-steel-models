<rect x="60" y="292" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="316" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">D04 yield strength RMSE</text><text x="448" y="316" fill="#0f766e" font-size="14" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">127.9791 MPa ± 9.8846 MPa</text>
<rect x="60" y="334" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="358" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">D04 yield strength R²</text><text x="448" y="358" fill="#0f766e" font-size="14" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">0.8141 ± 0.0388</text>
<text x="60" y="398" fill="#5b6673" font-size="12" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">train-fitted element vocabulary · n_jobs=1 · fixed random_state</text>
<rect x="500" y="116" width="440" height="300" rx="10" fill="#f6f8fb" stroke="#d8dee9" stroke-width="1"/>
<text x="520" y="146" fill="#b45309" font-size="15" font-weight="bold" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">BASELINE / EXTERNAL — context only</text>
<rect x="60" y="166" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="190" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Logistic D01 accuracy</text><text x="448" y="190" fill="#5b6673" font-size="14" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">0.5013</text>
<rect x="60" y="208" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="232" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Ridge D04 MAE (fold 0)</text><text x="448" y="232" fill="#5b6673" font-size="14" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">220.0009 MPa</text>
<rect x="60" y="250" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="274" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Train-mean D04 MAE</text><text x="448" y="274" fill="#5b6673" font-size="14" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">229.7445 MPa</text>
<rect x="60" y="292" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="316" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">MODNet MAE — external</text><text x="448" y="316" fill="#b45309" font-size="14" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">87.7627 MPa</text>
<rect x="60" y="334" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="358" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Y2R12 fatigue R² — external</text><text x="448" y="358" fill="#b45309" font-size="14" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">&gt; 0.97</text>
<text x="520" y="398" fill="#b45309" font-size="12" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">external numbers are not reproduced by this repository</text>
<rect x="40" y="436" width="900" height="184" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
<text x="60" y="468" fill="#0f766e" font-size="16" font-weight="bold" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Adoption gate: PASS</text>
<text x="60" y="498" fill="#17202c" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">MAE reduction vs train-mean on all five folds: 0.59, 0.61, 0.66, 0.61, 0.58</text>
<text x="60" y="526" fill="#17202c" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Requirement: &gt;= 50% on every fold and mean R2 &gt;= 0.70; observed mean R2 = 0.8141.</text>
<text x="60" y="554" fill="#17202c" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">MODNet 87.7627 MPa is near our 89.6300 MPa but uses a different model/featurization — not a reproduction.</text>
<text x="60" y="584" fill="#b45309" font-size="14" font-weight="bold" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">No plant data. No MODNet reproduction and no plant validation is claimed.</text>
<text x="40" y="642" fill="#5b6673" font-size="12" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">generated from results/metrics.json · base_commit 8b019bdf68ef</text>
