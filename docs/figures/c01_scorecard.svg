<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-label="C01 reproducibility case scorecard">
<rect width="980" height="620" fill="#ffffff"/>
<text x="40" y="50" fill="#17202c" font-size="25" font-weight="bold" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">C01 — reproducibility case scorecard</text>
<text x="40" y="78" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Public data · pinned environment · evidence A · no plant data</text>
<line x1="40" y1="96" x2="940" y2="96" stroke="#d8dee9" stroke-width="1"/>
<rect x="40" y="116" width="440" height="300" rx="10" fill="#f6f8fb" stroke="#d8dee9" stroke-width="1"/>
<text x="60" y="146" fill="#0f766e" font-size="16" font-weight="bold" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">OUR RESULTS — reproduced</text>
<rect x="60" y="166" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="190" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">D01 exact-match accuracy</text><text x="448" y="190" fill="#0f766e" font-size="15" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">0.5013</text>
<rect x="60" y="208" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="232" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">D01 macro F1</text><text x="448" y="232" fill="#0f766e" font-size="15" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">0.6207</text>
<rect x="60" y="250" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="274" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">D04 yield strength MAE</text><text x="448" y="274" fill="#0f766e" font-size="15" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">220.0009 MPa</text>
<rect x="60" y="292" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="316" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">D04 yield strength RMSE</text><text x="448" y="316" fill="#0f766e" font-size="15" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">273.1735 MPa</text>
<rect x="60" y="334" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="358" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">D04 yield strength R²</text><text x="448" y="358" fill="#0f766e" font-size="15" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">0.1271</text>
<text x="60" y="398" fill="#5b6673" font-size="12" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">seed 42 · official fold 0 · two identical runs</text>
<rect x="500" y="116" width="440" height="300" rx="10" fill="#f6f8fb" stroke="#d8dee9" stroke-width="1"/>
<text x="520" y="146" fill="#b45309" font-size="16" font-weight="bold" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">EXTERNAL LITERATURE — not reproduced</text>
<rect x="60" y="176" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="200" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">MatBench MODNet MAE</text><text x="448" y="200" fill="#b45309" font-size="15" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">87.7627 MPa</text>
<rect x="60" y="220" width="400" height="34" rx="6" fill="#ffffff" stroke="#d8dee9" stroke-width="1"/><text x="72" y="244" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Y2R12 fatigue R²</text><text x="448" y="244" fill="#b45309" font-size="15" font-weight="bold" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">&gt; 0.97</text>
<text x="520" y="300" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Different model / featurization, or unavailable data.</text>
<text x="520" y="326" fill="#5b6673" font-size="14" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">These numbers are cited, never claimed as our results.</text>
<text x="520" y="366" fill="#b45309" font-size="13" font-weight="bold" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">No plant validation is claimed in this repository.</text>
<rect x="40" y="436" width="900" height="144" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="60" y="468" fill="#1d4ed8" font-size="16" font-weight="bold" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Case verdict</text>
<text x="60" y="498" fill="#17202c" font-size="15" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">A downstream lab can regenerate all five of our numbers from public inputs and a pinned environment.</text>
<text x="60" y="526" fill="#17202c" font-size="15" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">The published high scores above remain external literature: this repository does not reproduce them.</text>
<text x="60" y="554" fill="#17202c" font-size="15" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Use our baselines as a reproducibility floor, not as a plant-validated performance claim.</text>
<text x="40" y="602" fill="#5b6673" font-size="12" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">generated from results/metrics.json · base_commit 37f1b545bd4e</text>
</svg>
